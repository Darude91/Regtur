name: Bouw Kijkdoos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build-nummer in de app zetten
        shell: bash
        run: echo "window.KD_BUILD = '#${{ github.run_number }} (${GITHUB_SHA::7})';" > www/build.js
      - name: mpv (ingebouwde speler) downloaden
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/mpv
          asset=$(gh release view --repo shinchiro/mpv-winbuild-cmake --json assets -q '.assets[].name' | grep -E '^mpv-x86_64-[0-9]+-git-.*\.7z$' | head -1)
          echo "mpv-build: $asset"
          gh release download --repo shinchiro/mpv-winbuild-cmake -p "$asset" -D mpvdl
          7z x "mpvdl/$asset" -obuild/mpv -y >/dev/null
          ls build/mpv | head
      - name: mpv-map aanwezig houden
        shell: bash
        run: mkdir -p build/mpv && touch build/mpv/.keep
      - run: npm install
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: kijkdoos-windows
          path: dist/*.exe

  android:
    name: Android (.apk — telefoon én Android TV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build-nummer in de app zetten
        run: echo "window.KD_BUILD = '#${{ github.run_number }} (${GITHUB_SHA::7})';" > www/build.js
      - run: npm install
      - run: npx cap add android
      - name: Android TV + telefoon (leanback, banner, iconen, http-streams)
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          python3 scripts/patch-android.py android build/icon.png
      - run: npx cap sync android
      - name: Controle - zit de nieuwste web-code in de APK?
        run: |
          grep -c 'btnDl' android/app/src/main/assets/public/index.html || true
          cat android/app/src/main/assets/public/build.js
      - name: APK bouwen (ondertekend als er een keystore-secret is, anders debug)
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release.keystore
            cat >> app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASS')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Kijkdoos.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Kijkdoos.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kijkdoos-android
          path: Kijkdoos.apk

  release:
    name: Downloads publiceren
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kijkdoos (nieuwste build)
          prerelease: false
          make_latest: true
          body: |
            **Android (telefoon én Android TV):** download `Kijkdoos.apk` en installeer (sta "onbekende bronnen" toe). Op Android TV: installeer via de app *Downloader* of *Send Files to TV*; Kijkdoos staat daarna op je startscherm.
            **Windows:** `Kijkdoos-Setup-*.exe` (installer) of `Kijkdoos-Portable-*.exe` (zonder installatie).
          files: out/*
